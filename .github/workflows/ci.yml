name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes cancel an in-flight run on the same ref (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo. The default token would otherwise carry write
# scopes a compromised action could abuse (Codex LOW-03).
permissions:
  contents: read

jobs:
  # Fast feedback: the frontend gates that don't need a Rust toolchain.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dependabot only PROPOSES bumps weekly; nothing failed a build if a package already in the
      # lockfile picked up an advisory in between. --omit=dev on purpose: the vite/vitest/svelte
      # toolchain generates a constant stream of dev-only transitive findings that would train
      # everyone to ignore this step, and none of it ships in the binary.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check        # svelte-check — type + i18n shape gate (0/0)
      - run: npm run check:i18n    # ru/en/zh leaf-key parity
      - run: npm test              # vitest (i18n parity, outcome, attention)

  # The native gates. Windows because Castellyn ships a Windows Tauri app
  # (WebView2 is preinstalled on the runner — no extra system deps needed).
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      # Pinned to a commit SHA for the same reason as release.yml (no signing key in this job, but the
      # ref should not float). `v1` exists as a tag, but tags move; a SHA does not.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-06-30
        with:
          toolchain: "1.94.0"   # must match rust-toolchain.toml — bump the two together
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # PowerShell static analysis on EVERY tracked script, not just tools/: build_all.ps1, verify.ps1
      # and the notify hook live outside it and are just as capable of breaking a user's machine.
      # Rules and severities come from PSScriptAnalyzerSettings.psd1 so this and verify.ps1 can never
      # disagree. Ordered BEFORE the cargo gates on purpose: while it sat last, a red cargo test meant
      # this step never executed at all, and the lint gate silently did nothing for weeks.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Pin the module version so a compromised/unexpected PSGallery release can't run on the runner
          # under the workflow token (Codex LOW-03). Bump deliberately, not floating.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = @()
          foreach ($f in (git ls-files '*.ps1' '*.psm1')) {
            $issues += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($issues) { $issues | Format-Table Severity, ScriptName, Line, RuleName -AutoSize; throw "PSScriptAnalyzer: $($issues.Count) issue(s)" }
      # generate_context! reads frontendDist (../build), so the lib won't
      # compile — clippy/test included — until the frontend is built.
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The lifecycle hook is Python and runs inside every live agent session, so a break there is
      # invisible to every other gate here. verify.ps1 runs this too; CI lists its gates by hand,
      # which is exactly how a test ends up green locally and absent in CI.
      - run: python -X utf8 tools/test_status_hook.py

  # The dependency gate: RustSec advisories + a permissive-license allow-list, config in
  # src-tauri/deny.toml. On its first run it caught RUSTSEC-2026-0194/0195 in quick-xml —
  # reachable only through the Linux Wayland clipboard backend, which is why deny.toml pins the
  # GRAPH to the Windows target instead of carrying an ignore-list that would rot.
  #
  # Its own job on ubuntu, NOT a step in `rust` above: cargo-deny-action is a container action and
  # containers only run on Linux runners, so on windows-latest it fails with "Container action is
  # only supported on Linux" before it ever looks at a dependency. The runner OS does not affect
  # the result — deny.toml fixes the target, and this reads Cargo.toml/Cargo.lock, never builds.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans licenses
