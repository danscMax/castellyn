[package]
name = "castellyn"
version = "0.8.0"
description = "Castellyn — control center for your AI coding dev environment"
authors = ["danscMax"]
edition = "2024"
# Matches the repo root LICENSE and package.json; without it SPDX scanners read this half as unlicensed.
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "castellyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Native folder/file pickers (Windows Explorer dialog) for working-folder inputs.
tauri-plugin-dialog = "2"
# Native clipboard — the web clipboard (navigator.clipboard + execCommand) is silently
# non-functional in the WebView2 shell, so copy buttons need the OS clipboard via this plugin.
tauri-plugin-clipboard-manager = "2"
# OS-level hotkey to show/hide the window from anywhere (registered from Rust only).
tauri-plugin-global-shortcut = "2"
# Native HTTP probes for provider liveness / model lists (replaces the PowerShell Invoke-RestMethod
# scripts). Blocking client (rustls by default), called from spawn_blocking. Minimal deps.
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time"] }
# Secrets (provider API keys + freellmapi dashboard token) live in the Windows Credential
# Manager, never in plaintext JSON. windows-native backend = no extra runtime deps.
keyring = { version = "3", features = ["windows-native"] }
# Real PTYs for the parallel-sessions tab: run each profile's `claude` in a true terminal so
# its TUI renders (xterm.js on the frontend). Output streams as raw bytes over a Tauri channel.
# PINNED to 0.8: 0.9.0 hardcodes PSEUDOCONSOLE_INHERIT_CURSOR, so conhost blocks waiting for a
# DSR cursor-position reply at startup — hangs headless PTYs (pty_echo_roundtrip) and races the
# xterm.js attach in Sessions. Re-evaluate when the flag becomes opt-out upstream.
portable-pty = "0.8"
tauri-plugin-process = "2"
# OS toasts for agent-status transitions in Sessions (fired from Rust — needs no JS capability).
tauri-plugin-notification = "2"
toml_edit = "0.25.12"
# TypeScript bindings for the IPC structs most likely to drift (see `#[ts(export)]` in lib.rs).
# A NORMAL dependency, not dev-only: the derive sits on types the lib compiles. The files are
# written by `cargo test` (already a mandatory gate) into src/lib/generated/ and are COMMITTED —
# src/lib/ipc.ts re-exports them, so a fresh clone must type-check before anything Rust has run.
ts-rs = "12.0.1"
# Official MCP SDK — used ONLY as a client, to run a real initialize/tools-list handshake against a
# configured MCP server (`probe_mcp` in mcp_probe.rs). `read_mcp` can only say a server is CONFIGURED.
# default-features off drops the server half, the macros and every HTTP transport: client +
# stdio-child-process costs 6 new crates (rmcp, process-wrap, futures, tokio-stream, cfg_aliases, nix).
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process"] }

# Win32 Job Object so PTY child trees (pwsh → claude/node, ssh.exe) die with the app instead of
# orphaning on a kill/crash. Windows-only; no-op stub elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # MessageBeep for agent-status sounds (system sounds — no bundled audio assets).
  # The function lives in System::Diagnostics::Debug; its MESSAGEBOX_STYLE arg needs UI feature.
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_WindowsAndMessaging",
  # GetLocalTime for schedule ticks (agent_schedules.rs). Explicit since windows 0.62 — 0.61 pulled
  # SystemInformation in transitively, 0.62 configures it out unless the feature is named.
  "Win32_System_SystemInformation",
  # SHFileOperationW: send a path to the Recycle Bin. Replaces shelling out to pwsh for
  # Microsoft.VisualBasic.FileIO — that path silently no-ops on a machine without PowerShell 7.
  "Win32_UI_Shell",
  # GetUserDefaultLocaleName: pick the tray language before the frontend reports its locale, so
  # the first tray paint is not Russian on an English machine.
  "Win32_Globalization",
  # Toast notifications built here rather than through tauri-plugin-notification: the plugin
  # exposes only title/body, and the crate under it (tauri-winrt-notification) cannot set a
  # notification's TAG or GROUP at all — so a second notice for the same session stacks up
  # instead of replacing the first. Going at WinRT directly also buys the click callback,
  # action buttons and the reminder scenario. See docs/adr/0004.
  "UI_Notifications",
  "Data_Xml_Dom",
  "Foundation",
  # Registering the AppUserModelID: Windows shows a toast only for an identity it knows, and it
  # learns one from a Start Menu shortcut carrying PKEY_AppUserModel_ID. Without this the whole
  # channel returns ERROR_NOT_FOUND (0x80070490) and every notification falls back to the plugin.
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
  # Junctions for profile folder links (links.rs): CreateFileW + DeviceIoControl with
  # FSCTL_SET_REPARSE_POINT. A junction needs no admin rights, unlike a directory symlink —
  # this is what removes the elevated repair path. See docs/adr/0003.
  "Win32_Storage_FileSystem",
  "Win32_System_Ioctl",
  "Win32_System_IO",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Single-instance guard (desktop-only): a second launch focuses the running window instead of
# opening a duplicate. Must be registered as the first plugin in run().
tauri-plugin-single-instance = "2"

# Release profile: strip symbols + thin LTO + one codegen unit. Measured: exe 16.0->14.2 MB (~10%
# — Rust release carries no debuginfo for strip to remove, so the real win is LTO/codegen, not size).
# NOT panic="abort": native ops rely on unwinding a panicked spawn_blocking closure into a JoinError
# (the .unwrap_or fallbacks) — abort would crash the whole app instead.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

